plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}


android {
    namespace 'com.offgrid.btfood'
    compileSdk 34

    defaultConfig {
        applicationId "com.offgrid.btfood"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Zero external dependencies! Uses pure built-in Android SDK classes for an ultra-small APK (<100KB)
}
